name: webgissus

services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webgissus}
      POSTGRES_USER: ${POSTGRES_USER:-webgissus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webgissus_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Fase 5: roteamento. Fora do `pnpm db:up`; suba com `pnpm rotas:up` depois de
  # `pnpm rotas:preparar` (gera data/processed/valhalla). Ver ADR 0005.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    profiles: ["rotas"]
    command: ["build_tiles"]
    environment:
      # Usa os tiles prontos: sem rebuild e sem olhar para PBFs.
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_tar: "False"
      build_admins: "False"
      build_time_zones: "False"
      serve_tiles: "True"
      server_threads: "${VALHALLA_THREADS:-4}"
    ports:
      - "127.0.0.1:${VALHALLA_PORT:-8002}:8002"
    volumes:
      - ../data/processed/valhalla:/custom_files
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8002/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
