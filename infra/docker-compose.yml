name: webgissus

services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webgissus}
      POSTGRES_USER: ${POSTGRES_USER:-webgissus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webgissus_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Fase 5: roteamento (Valhalla com recorte OSM do Sudeste)
  # valhalla:
  #   image: ghcr.io/valhalla/valhalla-scripted:<versão fixa>

volumes:
  pgdata:
