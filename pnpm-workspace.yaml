packages:
  - "apps/*"
  - "packages/*"

# pnpm 10+ bloqueia scripts de instalação por padrão; liberar só o necessário.
allowBuilds:
  esbuild: true
  "@parcel/watcher": false
  lmdb: false
  msgpackr-extract: false
  "@scarf/scarf": false  # telemetria do @nestjs/swagger

minimumReleaseAgeExclude:
  - "@nestjs/swagger@12.1.2"
  - "@playwright/test@1.65.1"
  - playwright-core@1.65.1
  - playwright@1.65.1
